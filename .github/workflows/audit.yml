# Advisories appear after a commit is merged, so this runs on a schedule as well as on
# every change to a lock file. The local pre-push hook runs the same tool, but only when
# someone happens to push.
name: audit

on:
  push:
    paths: ['**/Cargo.lock', '**/Cargo.toml', '.github/workflows/audit.yml']
  pull_request:
    paths: ['**/Cargo.lock', '**/Cargo.toml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version; rustup installs it on the first call.
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file firmware/Cargo.lock
      - run: cargo audit --file cli/Cargo.lock
