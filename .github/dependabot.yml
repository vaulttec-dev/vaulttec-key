# Dependency updates as pull requests. Both Cargo workspaces are separate, and the
# workflows pin action versions, so they need watching too.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /firmware
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
