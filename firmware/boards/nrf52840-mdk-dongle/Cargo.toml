[package]
name = "vaultkey-nrf52840-mdk-dongle"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "vaulttecdev hardware key on the Makerdiary nRF52840 MDK USB Dongle"
publish = false

[[bin]]
name = "vaultkey-nrf52840-mdk-dongle"
path = "src/main.rs"
test = false
bench = false

[dependencies]
vaultkey-core = { path = "../../core" }

# Everything below is what this chip needs; the key itself knows none of it.
nrf52840-hal = "0.19.0"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# The MBR at 0x0 hands over to 0x1000; `set-vtor` points the core at this image's
# vector table instead of relying on the MBR to forward exceptions.
cortex-m-rt = { version = "0.7", features = ["set-vtor"] }
critical-section = "1"
embedded-hal = "1.0"
embedded-storage = "0.3"
usb-device = "0.3"
usbd-serial = "0.2"
# CTAPHID, the HID interface FIDO2 speaks (docs2/roadmap.md, phase 6), beside the CDC one.
usbd-ctaphid = { version = "0.5", default-features = false }
ctaphid-dispatch = { version = "0.4", default-features = false }
static_cell = "2"
# The INFO text, built at boot; already in the tree through usb-device.
heapless = "0.8"

# The workspace's table with one difference: `unsafe_code` is `deny`, not `forbid`, so
# the one place that must name memory-mapped flash (`vault_region` in src/main.rs) can
# say why with #[expect]. tools/checks.sh keeps it identical otherwise; it stays last
# in this file because the check reads from here to the end.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
non_ascii_idents = "deny"
explicit_outlives_requirements = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Restriction lints that pay for themselves here.
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
exit = "deny"
missing_assert_message = "deny"
undocumented_unsafe_blocks = "deny"
# Pedantic lints that only ask for boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
