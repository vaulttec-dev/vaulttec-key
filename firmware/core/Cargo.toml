[package]
name = "vaultkey-core"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "vaulttecdev hardware TOTP key - everything that is not board-specific"
publish = false

[lib]
bench = false

[lints]
workspace = true

[dependencies]
# Hardware comes in through traits: flash, entropy, time, the port, the button and LED.
embedded-storage = "0.3"
rand_core = "0.10"

# Crypto: pure Rust, no_std, from RustCrypto. No hand-rolled primitives. The zeroize
# features make the crates scrub their expanded keys and HMAC pads when dropped.
# Argon2id without an allocator: the board hands over the memory it needs.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.9", default-features = false }
crc = "3.4"
