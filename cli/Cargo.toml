[package]
name = "vaultkey"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
description = "Host CLI for the vaulttecdev hardware key: set up a board, keep TOTP secrets on it, get codes"
publish = false

[[bin]]
name = "vkey"
path = "src/main.rs"

[dependencies]
# The firmware's own definition of the wire protocol, the credential parameters and
# what a PIN is: one source of truth on both ends of the cable.
vaultkey-core = { path = "../firmware/core" }
clap = { version = "4.5", features = ["derive"] }
serialport = "4.7"
# Flashing a bare board: espflash as a library, without its own CLI machinery.
espflash = { version = "4.5", default-features = false, features = ["serialport"] }
crossterm = "0.29"
rpassword = "7.3"
data-encoding = "2.6"
# Password-manager exports. Already in the tree through espflash; a state machine over
# buffers we own, so the fields land in memory that scrubs itself.
csv-core = "0.1"
url = "2.5"
percent-encoding = "2.3"
dirs = "6"
# The self-test's second opinion: an HMAC that is not the firmware's.
hmac = "0.13"
sha1 = "0.11"
zeroize = "1"
# Generated passwords: the OS random source, nothing seeded in userland.
getrandom = "0.2"

[build-dependencies]
# build.rs reads every firmware/boards/*/board.toml and embeds that board's images.
toml = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwinding on purpose: the shell's raw-mode guard must run if something panics,
# or the terminal is left unusable.

# The same table lives in firmware/Cargo.toml; the pre-commit hook fails if they differ.
# Every warning is an error, unsafe is impossible, every `as` that can lose bits and
# every `unwrap` must be spelled out and justified with `#[expect(..., reason)]`.
[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
non_ascii_idents = "deny"
explicit_outlives_requirements = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Restriction lints that pay for themselves here.
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
exit = "deny"
missing_assert_message = "deny"
undocumented_unsafe_blocks = "deny"
# Pedantic lints that only ask for boilerplate.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
